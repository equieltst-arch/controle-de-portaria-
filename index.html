<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PORTARIA PRO - BUCAGRANS</title>
<style>
:root {
  --bg-grad: radial-gradient(ellipse at 50% 0%, #0d2a4a 0%, #071525 55%, #020c17 100%);
  --glass: rgba(255,255,255,.06);
  --glass-2: rgba(255,255,255,.08);
  --line: rgba(255,255,255,.12);
  --line-soft: rgba(255,255,255,.08);
  --accent: #f59e0b;
  --brand: #1e3a5f;
  --txt: #e2e8f0;
  --muted: #94a3b8;
  --muted-2: #64748b;
  --ok: #22c55e;
  --blue: #1e3a5f;
  --danger: #ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg-grad);
  min-height:100vh;
  color:var(--txt);
  padding:0;
  line-height:1.5;
  text-transform:uppercase;
}
header{
  background:#fff;
  padding:14px 28px;
  border-bottom:1.5px solid #e5e7eb;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  color:#111827;
}
header h2{color:var(--brand);font-size:18px;font-weight:800}
header small{color:#64748b}

.stats,
.tabs-wrap,
#abaConteudo,
#telaHistorico{
  max-width:1400px;
  margin-left:auto;
  margin-right:auto;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:24px;
  margin-bottom:18px;
  padding:0 28px;
}
.card{
  background:var(--glass);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px 22px;
  backdrop-filter:blur(8px);
  text-align:center;
}
.card small{
  display:block;
  font-size:11px;
  color:var(--muted);
  font-weight:700;
  letter-spacing:.06em;
  margin-bottom:6px;
}

.tabs-wrap{
  display:flex;
  gap:6px;
  align-items:center;
  margin-bottom:15px;
  padding:0 28px;
}
.tab{
  padding:9px 16px;
  border:none;
  background:transparent;
  color:var(--muted-2);
  border-radius:10px;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  font-family:inherit;
  transition:all .2s;
}
.tab:hover:not(.ativo){background:rgba(30,58,95,.07);color:var(--brand)}
.tab.ativo{background:var(--brand);color:#fff;box-shadow:inset 0 0 0 2px var(--accent)}

#abaConteudo,
#telaHistorico{padding:0 28px 26px}

.porteiro-bar,
.form-area,
.hist-selecao,
.resumo-dia,
.table-wrap-proxy{
  background:var(--glass);
  border:1px solid var(--line);
  border-radius:14px;
  backdrop-filter:blur(8px);
}
.porteiro-bar{
  padding:12px 16px;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:12px;
}
.porteiro-bar label{font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}

.form-area{
  padding:16px;
  margin-bottom:16px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:10px;
}

input, select, textarea{
  background:rgba(255,255,255,.08);
  border:1.5px solid rgba(255,255,255,.15);
  color:var(--txt);
  padding:10px 12px;
  border-radius:9px;
  font-size:14px;
  font-family:inherit;
  width:100%;
  outline:none;
}
input::placeholder,textarea::placeholder{color:var(--muted-2)}
input:focus,select:focus,textarea:focus{border-color:rgba(245,158,11,.6);box-shadow:0 0 0 2px rgba(245,158,11,.2)}
input:not([type]), input[type="text"], input[type="search"], input[type="tel"], input[type="email"], textarea{text-transform:uppercase}

button{
  background:var(--accent);
  color:#fff;
  border:none;
  padding:10px 14px;
  border-radius:9px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  font-family:inherit;
  transition:opacity .15s, transform .15s;
}
button:hover{opacity:.9;transform:translateY(-1px)}

#telaHistorico{display:none}
#telaHistorico.visivel{display:block}
.hist-selecao{padding:20px;margin-bottom:16px}
.hist-selecao h3{font-size:14px;font-weight:800;color:var(--txt);margin-bottom:14px;letter-spacing:.03em}

.meses-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.mes-card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  border-radius:10px;
  padding:10px 8px;
  cursor:pointer;
  transition:all .18s;
  min-height:84px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
}
.mes-card:hover{transform:translateY(-1px);border-color:rgba(245,158,11,.6);background:rgba(255,255,255,.12)}
.mes-card.ativo{border-color:var(--accent);box-shadow:0 0 0 2px rgba(245,158,11,.25) inset}
.mc-mes{font-size:18px;font-weight:800;line-height:1;color:var(--txt)}
.mc-ano{font-size:10px;font-weight:700;color:var(--muted);margin-top:2px;letter-spacing:.05em}
.mc-info{font-size:9px;font-weight:700;color:#4ade80;background:#16653433;padding:2px 6px;border-radius:999px;display:inline-block;margin:6px auto 0}
.mc-toggle{font-size:9px;color:var(--muted);font-weight:800;margin-top:6px;letter-spacing:.04em}

.mes-dias{display:none;margin-bottom:14px}
.mes-dias.visivel{display:block}
.datas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.data-card{
  background:var(--glass-2);
  border:1px solid var(--line-soft);
  border-radius:10px;
  padding:10px 12px;
  cursor:pointer;
  text-align:center;
  transition:border-color .15s, background .15s, transform .15s;
}
.data-card:hover{border-color:rgba(245,158,11,.55);background:rgba(255,255,255,.12);transform:translateY(-1px)}
.data-card.ativa{border-color:var(--accent);box-shadow:0 0 0 2px rgba(245,158,11,.28) inset}
.data-card .dc-dia{font-size:22px;font-weight:800;color:var(--txt);line-height:1}
.data-card .dc-mes{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.05em;margin-top:2px}
.data-card .dc-badge{font-size:10px;font-weight:700;margin-top:5px;padding:2px 6px;border-radius:999px;background:rgba(255,255,255,.14);color:var(--muted);display:inline-block}

.hist-data-manual{
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:10px;
  padding:10px 14px;
  margin-top:8px;
}
.hist-data-manual label{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.hist-data-manual input[type="date"]{background:transparent;border:none;padding:0;width:auto;color-scheme:dark}

#painelDiaSelecionado{display:none}
#painelDiaSelecionado.visivel{display:block}
.voltar-btn{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  color:var(--muted);
  font-size:13px;
  font-weight:700;
  padding:7px 14px;
  border-radius:9px;
  cursor:pointer;
  margin-bottom:14px;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.voltar-btn:hover{border-color:rgba(245,158,11,.6);color:#fbbf24}

.busca-wrap{margin-bottom:14px}

table{width:100%;border-collapse:collapse;font-size:13px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;overflow:hidden}
thead tr{background:rgba(255,255,255,.08);border-bottom:2px solid rgba(255,255,255,.12)}
th{padding:11px 13px;text-align:left;font-weight:700;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:10px 12px;color:#cbd5e1;border-bottom:1px solid rgba(255,255,255,.06)}
tbody tr:nth-child(even){background:rgba(255,255,255,.03)}
tbody tr:hover td{background:rgba(255,255,255,.08)}

.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800}
.dentro{background:#dcfce7;color:#166534}
.saiu{background:#e2e8f0;color:#475569}

.btn-saida{background:var(--blue);color:#fff;padding:6px 10px;font-size:12px;font-weight:700;border-radius:8px}

.secao-titulo{
  background:rgba(255,255,255,.08);
  border:1px solid var(--line);
  border-left:3px solid var(--accent);
  padding:10px 15px;
  margin:10px 0 15px;
  font-weight:700;
  font-size:13px;
  color:var(--txt);
  border-radius:10px;
}

.resumo-dia{margin-top:15px;padding:12px 16px;font-size:13px;color:#cbd5e1}

#modalEdicao{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:20px;
}
#modalEdicao.aberto{display:flex}
.modal-box{
  background:#fff;
  border-radius:20px;
  padding:28px;
  width:100%;
  max-width:460px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  border:1px solid #e5e7eb;
}
.modal-box h3{font-size:17px;font-weight:800;color:var(--brand);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal-campo{margin-bottom:12px}
.modal-campo label{display:block;font-size:11px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.modal-box input,.modal-box select,.modal-box textarea{
  background:#fff;
  border:1.5px solid #e5e7eb;
  color:#111827;
}
.modal-box input::placeholder{color:#9ca3af}
.modal-acoes{display:flex;gap:8px;margin-top:18px}
.modal-acoes button{flex:1}
.btn-cancelar{background:#9ca3af !important;color:#fff !important;border:1px solid #9ca3af !important}

#fbStatus{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:#f1f5f9;
  border:1px solid #cbd5e1;
  border-radius:20px;
  padding:5px 12px;
  font-size:12px;
  font-weight:700;
  color:#64748b;
}

@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr);padding:0 16px}
  .tabs-wrap,#abaConteudo,#telaHistorico{padding-left:16px;padding-right:16px}
  header{padding:14px 16px}
}
@media(max-width:640px){
  .stats{grid-template-columns:1fr}
  .porteiro-bar{flex-direction:column;align-items:stretch}
}
</style>

</head>

// ===== TEMPO =====
function calcTempo(e, s){
  if(!e) return "-";
  const [h1,m1] = e.split(":").map(Number);
  let h2, m2;
  if(s && s.includes(":")){
    [h2,m2] = s.split(":").map(Number);
  } else {
    const now = new Date();
    h2 = now.getHours(); m2 = now.getMinutes();
  }
  const min = (h2*60+m2)-(h1*60+m1);
  return min < 0 ? "-" : Math.floor(min/60)+"h "+(min%60)+"m";
}

function renderTabs(){
  document.getElementById("tabHoje").className = "tab" + (abaAtiva==="hoje" ? " ativo" : "");
  document.getElementById("tabHistorico").className = "tab" + (abaAtiva==="historico" ? " ativo" : "");
}

// ===== SET ABA =====
window.setAba = function(aba){
  abaAtiva = aba;
  renderTabs();
  if(aba === "hoje"){
    document.getElementById("abaConteudo").style.display = "";
    document.getElementById("telaHistorico").classList.remove("visivel");
    renderHoje();
  } else {
    document.getElementById("abaConteudo").style.display = "none";
    document.getElementById("telaHistorico").classList.add("visivel");
    // volta pro painel de seleção ao clicar na aba
    mostrarSelecaoData();
  }
};

// ===== PAINEL SELEÇÃO DE DATA =====
function mostrarSelecaoData(){
  document.getElementById("painelSelecaoData").style.display = "";
  document.getElementById("painelDiaSelecionado").classList.remove("visivel");
  dataSelecionada = null;
  renderDatasGrid();
  // resetar stats para o total geral
  atualizarStatsHistorico();
}

function renderDatasGrid(){
  const datas = [...new Set([...datasHistorico, ...Object.keys(historicoCache)])]
    .filter(d => d !== hoje)
    .sort((a,b) => b.localeCompare(a));

  if(datas.length === 0){
    document.getElementById("datasGrid").innerHTML =
      `<div style="color:var(--muted);font-size:13px;padding:10px;grid-column:1/-1;">Nenhum histórico encontrado.</div>`;
    return;
  }

  const meses = ["JANEIRO","FEVEREIRO","MARCO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"];
  const agrupado = {};

  datas.forEach(d => {
    const [y,m] = d.split("-");
    const chaveMes = `${y}-${m}`;
    if(!agrupado[chaveMes]) agrupado[chaveMes] = [];
    agrupado[chaveMes].push(d);
  });

  const chavesMes = Object.keys(agrupado).sort((a,b) => b.localeCompare(a));
  if(chavesMes.length && !chavesMes.some(k => mesesExpandidos[k])) mesesExpandidos[chavesMes[0]] = true;

  let html = `<div class="meses-grid">`;
  chavesMes.forEach(chaveMes => {
      const [y,m] = chaveMes.split("-");
      const nomeMes = meses[parseInt(m,10)-1] || m;
      const diasMes = agrupado[chaveMes].sort((a,b) => b.localeCompare(a));
      const ativo = !!mesesExpandidos[chaveMes];

      let totalMes = 0;
      let abertosMes = 0;
      diasMes.forEach(d => {
        const regs = historicoCache[d] || [];
        totalMes += regs.length;
        abertosMes += regs.filter(r=>!r.saida).length;
      });

      html += `<div class="mes-card ${ativo ? 'ativo' : ''}" onclick="toggleMes('${chaveMes}')">
        <div class="mc-mes">${nomeMes.slice(0,3)}</div>
        <div class="mc-ano">${y}</div>
        <div class="mc-info">${totalMes} VEIC.</div>
        <div class="mc-toggle">${ativo ? 'CLIQUE PARA RECOLHER' : 'CLIQUE PARA EXPANDIR'}</div>
      </div>`;
  });
  html += `</div>`;

  chavesMes.forEach(chaveMes => {
      const diasMes = agrupado[chaveMes].sort((a,b) => b.localeCompare(a));
      const ativo = !!mesesExpandidos[chaveMes];

      html += `<div class="mes-dias ${ativo ? 'visivel' : ''}"><div class="datas-grid">`;

      diasMes.forEach(d => {
        const regs = historicoCache[d] || [];
        const total = regs.length;
        const semSaida = regs.filter(r=>!r.saida).length;
        const [yy,mm,dd] = d.split("-");
        const mesCurto = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"][parseInt(mm,10)-1] || mm;

        html += `<div class="data-card ${dataSelecionada===d?'ativa':''}" onclick="abrirData('${d}')">
          <div class="dc-dia">${dd}</div>
          <div class="dc-mes">${mesCurto} ${yy.slice(2)}</div>
          ${total > 0
            ? `<div class="dc-badge" style="background:#3fb95022;color:#3fb950">${total} VEIC.</div>`
            : `<div class="dc-badge">VAZIO</div>`
          }
          ${semSaida > 0 ? `<div class="dc-badge" style="background:#f0a50022;color:#f0a500;margin-left:2px">${semSaida} ABERTOS</div>` : ""}
        </div>`;
      });

      html += `</div></div>`;
  });

  document.getElementById("datasGrid").innerHTML = html;
}

function atualizarStatsHistorico(){
  // soma todos os registros de histórico
  let d=0, s=0, t=0;
  Object.keys(historicoCache).filter(k=>k!==hoje).forEach(k=>{
    (historicoCache[k]||[]).forEach(r=>{ t++; if(r.saida) s++; else d++; });
  });
  document.getElementById("contDentro").innerText = d;
  document.getElementById("contSaiu").innerText = s;
  document.getElementById("contTotal").innerText = t;
}

// ===== ABRIR DATA (dentro do histórico) =====
window.abrirData = function(data){
  dataSelecionada = data;
  document.getElementById("painelSelecaoData").style.display = "none";
  document.getElementById("painelDiaSelecionado").classList.add("visivel");
  renderHistorico(data);
};

// ===== VOLTAR AO CALENDÁRIO =====
window.voltarSelecao = function(){
  mostrarSelecaoData();
};

// ===== ABRIR DATA MANUAL =====
window.abrirDataManual = function(data){
  if(!data) return;
  if(data === hoje){ setAba("hoje"); return; }
  if(!historicoCache[data]) historicoCache[data] = [];
  if(!datasHistorico.includes(data)) datasHistorico.push(data);
  const [y,m] = data.split("-");
  mesesExpandidos[`${y}-${m}`] = true;
  abrirData(data);
};

window.toggleMes = function(chaveMes){
  const estavaAberto = !!mesesExpandidos[chaveMes];
  mesesExpandidos = {};
  if(!estavaAberto) mesesExpandidos[chaveMes] = true;
  renderDatasGrid();
};

// ===== MODO FORMULÁRIO (ENTRADA/SAÍDA) =====
let _entradaSelecionadaId = null;

window.setModoForm = function(modo, data){
  const fe = document.getElementById("formEntrada_"+data);
  const fs = document.getElementById("formSaida_"+data);
  const be = document.getElementById("btnModoEntrada");
  const bs = document.getElementById("btnModoSaida");
  if(!fe||!fs) return;
  if(modo === "entrada"){
    fe.style.display=""; fs.style.display="none";
    be.style.background="var(--accent)"; be.style.color="#000"; be.style.border="none";
    bs.style.background="var(--surface2)"; bs.style.color="var(--muted)"; bs.style.border="1px solid var(--border)";
  } else {
    fe.style.display="none"; fs.style.display="";
    bs.style.background="var(--accent)"; bs.style.color="#000"; bs.style.border="none";
    be.style.background="var(--surface2)"; be.style.color="var(--muted)"; be.style.border="1px solid var(--border)";
    mostrarEntradasAbertas(data, "");
  }
};

function mostrarEntradasAbertas(data, filtroPlaca){
  const el = document.getElementById("entradasAbertas_"+data);
  if(!el) return;
  const registros = (historicoCache[data]||[]).filter(r =>
    !r.saida && (!filtroPlaca || r.placa.includes(filtroPlaca.toUpperCase()))
  );
  if(registros.length === 0){
    el.innerHTML = `<div style="font-size:12px;color:var(--muted);padding:8px 0;">Nenhuma entrada aberta encontrada.</div>`;
    return;
  }
  let html = `<div style="font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:700;">ENTRADAS SEM SAÍDA — clique para selecionar:</div>
    <div style="display:flex;flex-direction:column;gap:6px;">`;
  registros.forEach(r => {
    html += `<div id="cardEntrada_${r.id}" onclick="selecionarEntrada('${r.id}','${r.placa}','${r.nome}','${data}')"
      style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;cursor:pointer;display:flex;gap:16px;align-items:center;font-size:13px;transition:border-color .15s;">
      <b style="color:var(--accent)">${r.placa}</b>
      <span style="color:#e6edf3">${r.nome}</span>
      <span style="color:var(--muted)">${r.hora}</span>
      <span style="color:var(--muted);font-size:11px">${r.empresa||""}</span>
    </div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
}

window.buscarEntradaAberta = function(data){
  const placa = document.getElementById("saidaPlaca").value.trim();
  _entradaSelecionadaId = null;
  document.getElementById("saidaInfoEntrada").innerHTML = `<span style="color:var(--muted)">Digite a placa para buscar a entrada</span>`;
  mostrarEntradasAbertas(data, placa);
};

window.selecionarEntrada = function(id, placa, nome, data){
  _entradaSelecionadaId = id;
  document.querySelectorAll("[id^='cardEntrada_']").forEach(el => {
    el.style.borderColor = "var(--border)";
    el.style.background = "var(--surface2)";
  });
  const card = document.getElementById("cardEntrada_"+id);
  if(card){ card.style.borderColor="var(--accent)"; card.style.background="#1c2330"; }
  document.getElementById("saidaPlaca").value = placa;
  document.getElementById("saidaInfoEntrada").innerHTML =
    `<span style="color:var(--green)">✔ ${placa} — ${nome}</span>`;
  const qs = document.getElementById("saidaQuem");
  if(qs && !qs.value) qs.value = nome;
};

window.registrarSaidaRetroativa = async function(data){
  const hora  = document.getElementById("saidaHora").value;
  const quem  = emMaiusculo(document.getElementById("saidaQuem").value);
  if(!hora){ alert("Informe a hora de saída"); return; }
  if(!_entradaSelecionadaId){ alert("Selecione a entrada na lista abaixo"); return; }
  await updateDoc(doc(db,"portaria", _entradaSelecionadaId),{ saida: hora, quemSaiu: quem });
  const reg = (historicoCache[data]||[]).find(r=>r.id===_entradaSelecionadaId);
  if(reg){ reg.saida = hora; reg.quemSaiu = quem; }
  _entradaSelecionadaId = null;
  document.getElementById("saidaPlaca").value="";
  document.getElementById("saidaQuem").value="";
  document.getElementById("saidaInfoEntrada").innerHTML=`<span style="color:var(--green)">✔ Saída registrada!</span>`;
  renderHistorico(data);
  setTimeout(()=>{
    const det=document.getElementById("formRetroativo");
    if(det) det.open=true;
    setModoForm("saida", data);
  },50);
};

window.addRetroativo = async function(data){
  const h   = document.getElementById("histHora").value;
  const p   = document.getElementById("histPlaca").value.toUpperCase().trim();
  const n   = emMaiusculo(document.getElementById("histNome").value);
  const emp = emMaiusculo(document.getElementById("histEmpresa").value);
  const ocu = Number(document.getElementById("histOcupantes").value)||1;
  const por = emMaiusculo(document.getElementById("histPorteiro").value);
  if(!h||!p||!n){ alert("Preencha hora, placa e nome!"); return; }
  const docRef = await addDoc(collection(db,"portaria"),{
    data, hora: h, placa: p, nome: n, empresa: emp, ocupantes: ocu,
    porteiro: por||"—", saida: "", quemSaiu: "",
    ts: new Date(data+"T"+h+":00").getTime()
  });
  if(!historicoCache[data]) historicoCache[data] = [];
  historicoCache[data].push({id:docRef.id,data,hora:h,placa:p,nome:n,empresa:emp,ocupantes:ocu,porteiro:por||"—",saida:"",quemSaiu:""});
  historicoCache[data].sort((a,b)=>a.hora.localeCompare(b.hora));
  document.getElementById("histPlaca").value="";
  document.getElementById("histNome").value="";
  document.getElementById("histEmpresa").value="";
  document.getElementById("histOcupantes").value="1";
  renderHistorico(data);
  setTimeout(()=>{
    const det=document.getElementById("formRetroativo");
    if(det) det.open=true;
    setModoForm("entrada", data);
  },50);
};

async function carregarDatasHistorico(){
  try {
    const snap = await getDocs(collection(db,"portaria"));
    const datas = new Set();
    snap.forEach(d => {
      const data = d.data().data;
      if(data && data !== hoje) datas.add(data);
    });
    for(const data of datas){
      if(!historicoCache[data]){
        const registros = [];
        snap.forEach(d => {
          if(d.data().data === data) registros.push({id:d.id,...d.data()});
        });
        registros.sort((a,b)=> a.hora.localeCompare(b.hora));
        historicoCache[data] = registros;
      }
      datasHistorico.push(data);
    }
    if(abaAtiva === "historico") renderDatasGrid();
    setFbStatus(true);
  } catch(e){
    setFbStatus(false);
  }
}

// ===== OUVIR HOJE =====
function ouvirHoje(){
  if(unsubHoje) unsubHoje();
  const q = query(collection(db,"portaria"), orderBy("ts","asc"));
  unsubHoje = onSnapshot(q, snap => {
    registrosHoje = [];
    const novasDatas = new Set(datasHistorico);
    snap.forEach(d => {
      const reg = {id:d.id,...d.data()};
      if(reg.data === hoje){
        registrosHoje.push(reg);
      } else if(reg.data && reg.data !== hoje){
        novasDatas.add(reg.data);
        if(!historicoCache[reg.data]) historicoCache[reg.data] = [];
        const idx = historicoCache[reg.data].findIndex(r=>r.id===reg.id);
        if(idx === -1) historicoCache[reg.data].push(reg);
        else historicoCache[reg.data][idx] = reg;
      }
    });
    datasHistorico = [...novasDatas].filter(d=>d!==hoje);
    if(abaAtiva === "hoje") renderHoje();
    else if(abaAtiva === "historico" && !dataSelecionada) renderDatasGrid();
    setFbStatus(true);
  }, () => setFbStatus(false));
}

  let html = `
    <div class="porteiro-bar">

      <input type="text" id="nome" placeholder="NOME">
      <input type="text" id="empresa" placeholder="EMPRESA">
      <input type="number" id="ocupantes" value="1">

    </div>
    <div class="busca-wrap">
      <input type="text" id="busca" placeholder="🔍 Buscar placa ou nome..." oninput="renderHoje()" value="${busca}">
    </div>
    <table>
      <thead><tr>
        <th>Status</th><th>Entrada</th><th>Placa</th><th>Entrou</th><th>Empresa</th><th>Tempo</th><th>Saída / Quem saiu</th><th></th>
      </tr></thead>
      <tbody>`;

  let d=0, s=0;
  registrosHoje
    .filter(r => r.placa.toLowerCase().includes(busca) || r.nome.toLowerCase().includes(busca))
    .sort((a,b) => b.ts - a.ts)
    .forEach(r => {

      html += `<tr>

        <td>${r.hora}</td>
        <td><b>${r.placa}</b></td>
        <td>${r.nome}</td>
        <td style="color:var(--muted);font-size:13px">${r.empresa||""}</td>
        <td style="color:var(--muted);font-size:13px">${calcTempo(r.hora,r.saida)}</td>
        <td>${!r.saida
          ? `<div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;">
               <input type="time" id="saida-${r.id}" style="width:88px">
               <input type="text" id="quemSaiu-${r.id}" placeholder="Quem saiu" style="width:110px;font-size:12px;">
               <button class="btn-saida" onclick="confirmarSaida('${r.id}')">OK</button>
             </div>`
          : `<div style="line-height:1.4">
               <span style="color:#e6edf3;font-weight:600">${r.saida}</span>
               ${r.quemSaiu ? `<br><span style="color:var(--muted);font-size:12px">↪ ${r.quemSaiu}</span>` : ""}
             </div>`
        }</td>
        <td><button onclick="abrirEdicao('${r.id}','${r.hora}','${r.placa}','${r.nome.replace(/'/g,"\\'")}','${(r.empresa||"").replace(/'/g,"\\'")}',${r.ocupantes||1},'${r.saida||""}','${(r.quemSaiu||"").replace(/'/g,"\\'")}'); event.stopPropagation();" style="background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 8px;font-size:12px;border-radius:4px;margin-right:3px">✏️</button><button onclick="apagarRegistro('${r.id}','${r.placa} — ${r.nome.replace(/'/g,"\\'")}'); event.stopPropagation();" style="background:transparent;border:1px solid #6e2020;color:#f87171;padding:4px 8px;font-size:12px;border-radius:4px;">🗑️</button></td>
      </tr>`;
    });

  html += `</tbody></table>`;
  document.getElementById("abaConteudo").innerHTML = html;
  document.getElementById("contDentro").innerText = d;
  document.getElementById("contSaiu").innerText = s;
  document.getElementById("contTotal").innerText = registrosHoje.length;

  document.getElementById("porteiro").addEventListener("input", e => {
    porteiroAtual = emMaiusculo(e.target.value);
    e.target.value = porteiroAtual;
    localStorage.setItem("porteiro_dia", porteiroAtual);
  });
}

async function obterLogoRelatorio(){
  return await new Promise(resolve => {
    try {
      const baseImg = document.querySelector("header img");
      const src = (baseImg && baseImg.src) ? baseImg.src : "logo-pch.png";
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = function(){
        try {
          const canvas = document.createElement("canvas");
          canvas.width = img.naturalWidth || 512;
          canvas.height = img.naturalHeight || 512;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img,0,0);
          resolve(canvas.toDataURL("image/png"));
        } catch(_) { resolve(null); }
      };
      img.onerror = function(){ resolve(null); };
      img.src = src;
    } catch(_) { resolve(null); }
  });
}

window.baixarRelatorio = async function(){
  if(!window.jspdf || !window.jspdf.jsPDF){
    alert("NAO FOI POSSIVEL CARREGAR O GERADOR DE PDF.");
    return;
  }

  const agora = new Date();
  const carimbo = `${agora.toLocaleDateString("pt-BR")} ${agora.toLocaleTimeString("pt-BR")}`;

  let titulo = "RELATORIO DE PORTARIA";
  let nomeArquivo = "relatorio-portaria";
  let resumoLinhas = [];
  let colunas = [];
  let linhasTabela = [];

  if(abaAtiva === "hoje"){
    const lista = [...registrosHoje].sort((a,b)=>(a.ts||0)-(b.ts||0));
    const dentro = lista.filter(r=>!r.saida).length;
    const saiu = lista.filter(r=>!!r.saida).length;

    titulo = `RELATORIO DE PORTARIA - HOJE (${hoje})`;
    nomeArquivo = `relatorio-portaria-hoje-${hoje}`;
    resumoLinhas = [
      `GERADO EM: ${carimbo}`,
      `TOTAL: ${lista.length} | NO PATIO: ${dentro} | SAIU: ${saiu}`
    ];
    colunas = ["DATA","PLACA","NOME","EMPRESA","PORTEIRO","ENTRADA","SAIDA","STATUS"];
    linhasTabela = lista.map(r => [
      emMaiusculo(r.data||""),
      emMaiusculo(r.placa||""),
      emMaiusculo(r.nome||""),
      emMaiusculo(r.empresa||"-"),
      emMaiusculo(r.porteiro||"-"),
      emMaiusculo(r.hora||"-"),
      emMaiusculo(r.saida||"-"),
      r.saida ? "SAIU" : "NO PATIO"
    ]);
  } else if(dataSelecionada){
    const lista = [...(historicoCache[dataSelecionada]||[])].sort((a,b)=> (a.hora||"").localeCompare(b.hora||""));
    const dentro = lista.filter(r=>!r.saida).length;
    const saiu = lista.filter(r=>!!r.saida).length;

    titulo = `RELATORIO DE PORTARIA - HISTORICO (${dataSelecionada})`;
    nomeArquivo = `relatorio-portaria-${dataSelecionada}`;
    resumoLinhas = [
      `GERADO EM: ${carimbo}`,
      `DATA: ${dataSelecionada}`,
      `TOTAL: ${lista.length} | NO PATIO: ${dentro} | SAIU: ${saiu}`
    ];
    colunas = ["PLACA","NOME","EMPRESA","PORTEIRO","ENTRADA","SAIDA","QUEM SAIU","STATUS"];
    linhasTabela = lista.map(r => [
      emMaiusculo(r.placa||""),
      emMaiusculo(r.nome||""),
      emMaiusculo(r.empresa||"-"),
      emMaiusculo(r.porteiro||"-"),
      emMaiusculo(r.hora||"-"),
      emMaiusculo(r.saida||"-"),
      emMaiusculo(r.quemSaiu||"-"),
      r.saida ? "SAIU" : "NO PATIO"
    ]);
  } else {
    const datas = Object.keys(historicoCache)
      .filter(k => k !== hoje)
      .sort((a,b) => b.localeCompare(a));
    const resumoMes = {};

    datas.forEach(d=>{
      const [y,m] = d.split("-");
      const chave = `${y}-${m}`;
      if(!resumoMes[chave]) resumoMes[chave] = {dias:0,total:0,dentro:0,saiu:0};
      const regs = historicoCache[d] || [];
      resumoMes[chave].dias += 1;
      resumoMes[chave].total += regs.length;
      resumoMes[chave].dentro += regs.filter(r=>!r.saida).length;
      resumoMes[chave].saiu += regs.filter(r=>!!r.saida).length;
    });

    titulo = "RELATORIO GERAL DO HISTORICO";
    nomeArquivo = "relatorio-portaria-historico-geral";
    resumoLinhas = [
      `GERADO EM: ${carimbo}`,
      `MESES ENCONTRADOS: ${Object.keys(resumoMes).length}`
    ];
    colunas = ["MES","DIAS","TOTAL","NO PATIO","SAIU"];
    linhasTabela = Object.keys(resumoMes)
      .sort((a,b)=>b.localeCompare(a))
      .map(chave => {
        const r = resumoMes[chave];
        return [chave, String(r.dias), String(r.total), String(r.dentro), String(r.saiu)];
      });
  }

  if(!linhasTabela.length){
    linhasTabela = [["NENHUM REGISTRO ENCONTRADO.","","","",""]];
    if(colunas.length === 8) linhasTabela = [["NENHUM REGISTRO ENCONTRADO.","","","","","","",""]];
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:"l", unit:"mm", format:"a4"});
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margemX = 10;
  const logoData = await obterLogoRelatorio();

  const desenharCabecalho = () => {
    doc.setFillColor(30,58,95);
    doc.rect(0,0,pageW,24,"F");
    doc.setFillColor(245,158,11);
    doc.rect(0,24,pageW,1.2,"F");
    if(logoData){
      try { doc.addImage(logoData,"PNG",8,4,15,15); } catch(_) {}
    }
    doc.setTextColor(255,255,255);
    doc.setFont("helvetica","bold");
    doc.setFontSize(11);
    doc.text("CONTROLE DE PORTARIA", logoData ? 26 : 10, 10);
    doc.setFont("helvetica","normal");
    doc.setFontSize(8.5);
    doc.text("BUCAGRANS - RELATORIO OFICIAL", logoData ? 26 : 10, 15);
    doc.text(`GERADO: ${carimbo}`, pageW - 10, 10, {align:"right"});
    doc.text(`ABA: ${abaAtiva.toUpperCase()}`, pageW - 10, 15, {align:"right"});
    doc.setTextColor(20,20,20);
  };

  desenharCabecalho();

  let y = 31;
  doc.setFont("helvetica","bold");
  doc.setFontSize(12);
  doc.setTextColor(30,58,95);
  doc.text(emMaiusculo(titulo), margemX, y);
  y += 5;

  doc.setFont("helvetica","normal");
  doc.setFontSize(8.5);
  doc.setTextColor(60,60,60);
  resumoLinhas.forEach(l => {
    doc.text(emMaiusculo(l), margemX, y);
    y += 4;
  });

  doc.autoTable({
    startY: y + 2,
    head: [colunas],
    body: linhasTabela,
    margin: {left:margemX, right:margemX},
    theme: "grid",
    styles: {
      fontSize: 7.6,
      cellPadding: 1.8,
      textColor: [30,41,59],
      lineColor: [226,232,240],
      lineWidth: 0.15
    },
    headStyles: {
      fillColor: [30,58,95],
      textColor: [255,255,255],
      fontStyle: "bold",
      halign: "left"
    },
    alternateRowStyles: {
      fillColor: [248,250,252]
    },
    didDrawPage: function(data){
      if(data.pageNumber > 1) desenharCabecalho();
      doc.setFont("helvetica","normal");
      doc.setFontSize(8);
      doc.setTextColor(120,120,120);
      doc.text(`PAGINA ${data.pageNumber}`, pageW - 10, pageH - 6, {align:"right"});
    }
  });

  doc.save(`${nomeArquivo}.pdf`);
};

};

window.limparSaida = function(){
  document.getElementById("editSaida").value    = "";

};

window.salvarEdicao = async function(){
  const id        = document.getElementById("editId").value;
  const hora      = document.getElementById("editHora").value;
  const placa     = document.getElementById("editPlaca").value.toUpperCase().trim();
  const nome      = emMaiusculo(document.getElementById("editNome").value);
  const empresa   = emMaiusculo(document.getElementById("editEmpresa").value);
  const ocupantes = Number(document.getElementById("editOcupantes").value)||1;
  const saida     = document.getElementById("editSaida").value || "";
  const quemSaiu  = emMaiusculo(document.getElementById("editQuemSaiu").value);
  if(!id||!hora||!placa||!nome){ alert("Preencha hora, placa e nome!"); return; }
  try {
    await updateDoc(doc(db,"portaria",id),{ hora, placa, nome, empresa, ocupantes, saida, quemSaiu });
    const patch = { hora, placa, nome, empresa, ocupantes, saida, quemSaiu };
    for(const key of Object.keys(historicoCache)){
      const idx = historicoCache[key].findIndex(r=>r.id===id);
      if(idx !== -1){ Object.assign(historicoCache[key][idx], patch); break; }
    }
    const ri = registrosHoje.findIndex(r=>r.id===id);
    if(ri !== -1) Object.assign(registrosHoje[ri], patch);
    fecharEdicao();
    if(abaAtiva === "hoje") renderHoje();
    else if(dataSelecionada) renderHistorico(dataSelecionada);
  } catch(e){
    alert("Erro ao salvar: " + e.message);
  }
};

// ===== APAGAR REGISTRO =====
window.apagarRegistro = async function(id, descricao){
  if(!confirm(`Apagar registro:\n${descricao}\n\nEsta ação não pode ser desfeita!`)) return;
  try {
    await deleteDoc(doc(db,"portaria",id));
    for(const key of Object.keys(historicoCache)){
      const idx = historicoCache[key].findIndex(r=>r.id===id);
      if(idx !== -1){ historicoCache[key].splice(idx,1); break; }
    }
    const ri = registrosHoje.findIndex(r=>r.id===id);
    if(ri !== -1) registrosHoje.splice(ri,1);
    if(abaAtiva === "hoje") renderHoje();
    else if(dataSelecionada) renderHistorico(dataSelecionada);
  } catch(e){
    alert("Erro ao apagar: " + e.message);
  }
};

<script>
// Converter o valor real para maiúsculas em todos os campos de texto (inclui inputs sem atributo type)
;(function(){
  const selector = 'input:not([type]), input[type="text"], input[type="search"], input[type="tel"], input[type="email"], textarea';
  function toUpper(e){
    try{ const v = e.target.value; e.target.value = v.toUpperCase(); }catch(e){}
  }
  document.querySelectorAll(selector).forEach(el=>{
    el.addEventListener('input', toUpper, {passive:false});
    el.addEventListener('blur', toUpper);
  });
  // observe future added elements
  const obs = new MutationObserver(muts=>{
    muts.forEach(m=>{
      m.addedNodes && m.addedNodes.forEach(node=>{
        if(!(node instanceof HTMLElement)) return;
        if(node.matches && node.matches(selector)){
          node.addEventListener('input', toUpper, {passive:false});
          node.addEventListener('blur', toUpper);
        }
        node.querySelectorAll && node.querySelectorAll(selector).forEach(el=>{
          el.addEventListener('input', toUpper, {passive:false});
          el.addEventListener('blur', toUpper);
        });
      });
    });
  });
  obs.observe(document.body,{childList:true,subtree:true});
})();
</script>
